<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Studio Broadcast</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DEV STUDIO BROADCAST</p>
        <h1>오늘의 개발 방송</h1>
        <p class="subcopy">만드는 과정을 방송처럼 기록하고 보여 주는 작업 전시관</p>
      </div>
      <div class="live-pill"><span></span> 개발 중</div>
    </header>

    <section class="hero-grid">
      <article class="broadcast-card">
        <div class="card-label">NOW BUILDING</div>
        <div class="broadcast-main">
          <div>
            <p class="project-kicker" id="gameGenre"></p>
            <h2 id="gameTitle"></h2>
            <p id="gameSummary"></p>
            <div class="progress-row"><span>진행률</span><strong id="gameProgressText"></strong></div>
            <div class="progress-track"><span id="gameProgressBar"></span></div>
          </div>
          <div class="signal-box"><div class="signal-dot"></div><span>LIVE</span><small>작업 신호 정상</small></div>
        </div>
        <div class="broadcast-actions">
          <button class="primary" id="playVideo">게임 작업물 보기</button>
          <button class="secondary" id="openRepo">GitHub 열기</button>
        </div>
      </article>

      <aside class="next-card">
        <div class="card-label">NEXT ON AIR</div>
        <h3 id="nextTitle"></h3>
        <p id="nextDescription"></p>
        <div class="next-meta"><span id="nextDate"></span><strong id="nextType"></strong></div>
      </aside>
    </section>

    <section class="section-block">
      <div class="section-heading"><div><p class="eyebrow">RECENT LOG</p><h2>최근 개발 기록</h2></div><span id="logStatus"></span></div>
      <div class="log-grid" id="logList"></div>
    </section>

    <section class="section-block">
      <div class="section-heading"><div><p class="eyebrow">CHANNELS</p><h2>작품 채널</h2></div><button class="text-button" id="showAll">전체 보기</button></div>
      <div class="channel-grid" id="channelList"></div>
    </section>

    <section class="section-block conversation-section">
      <div class="section-heading"><div><p class="eyebrow">CONVERSATION</p><h2>개발 대화</h2></div><span id="conversationCount"></span></div>
      <div class="conversation-layout">
        <div class="conversation-list" id="conversationList"></div>
        <form class="conversation-form" id="conversationForm">
          <label for="conversationInput">새로운 생각이나 결정 기록</label>
          <textarea id="conversationInput" rows="3" placeholder="예: 코인 획득을 다음 방송에서 만들자"></textarea>
          <div class="conversation-form-footer"><span>이 브라우저에만 임시 저장됩니다.</span><button class="primary" type="submit">대화 남기기</button></div>
        </form>
      </div>
    </section>

    <footer><span>dev-studio-broadcast</span><span><a class="footer-link" href="https://github.com/jes79/dev-studio-broadcast/tree/master/conversations" target="_blank" rel="noreferrer">대화 이어하기 폴더</a> · 첫 방송 준비 중</span></footer>
  </main>
  <script src="src/app.js"></script>
</body>
</html>
